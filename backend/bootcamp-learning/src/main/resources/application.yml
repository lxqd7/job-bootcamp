server:
  port: ${LEARNING_PORT:18083}
  shutdown: graceful

spring:
  application:
    name: bootcamp-learning
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${LEARNING_DB_NAME:bc_learning}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: ${RABBIT_VHOST:/job-bootcamp-dev}
    publisher-confirm-type: correlated

app:
  internal:
    secret: ${INTERNAL_TOKEN_KEY:dev-only-internal-secret}
  user:
    session-check-url: ${USER_INTERNAL_URL:http://127.0.0.1:18081/int/v1/sessions/check}
  course:
    metadata-url: ${COURSE_METADATA_URL:http://127.0.0.1:18082/int/v1/lessons/metadata}
    play-issue-url: ${COURSE_PLAY_ISSUE_URL:http://127.0.0.1:18082/int/v1/play-sessions/issue}
    play-check-url: ${COURSE_PLAY_CHECK_URL:http://127.0.0.1:18082/int/v1/play-sessions/check}
  outbox:
    transport: ${OUTBOX_TRANSPORT:none}
    exchange: ${RABBIT_EXCHANGE:bc.domain.v1}
    relay-enabled: ${OUTBOX_RELAY_ENABLED:false}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    lease-seconds: ${OUTBOX_LEASE_SECONDS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    rabbit:
      enabled: ${RABBIT_HEALTH_ENABLED:false}

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
  level:
    com.jobbootcamp: INFO