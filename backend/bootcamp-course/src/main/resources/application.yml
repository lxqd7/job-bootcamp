server:
  port: ${COURSE_PORT:18082}
  shutdown: graceful

spring:
  application:
    name: bootcamp-course
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:bc_course}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: ${RABBIT_VHOST:/job-bootcamp-dev}
    publisher-confirm-type: correlated

app:
  internal:
    secret: ${INTERNAL_TOKEN_KEY:dev-only-internal-secret}
  user:
    session-check-url: ${USER_INTERNAL_URL:http://127.0.0.1:18081/int/v1/sessions/check}
  learning:
    free-claim-url: ${LEARNING_FREE_CLAIM_URL:http://127.0.0.1:18083/int/v1/free-claims}
  claim:
    retry-interval-ms: ${CLAIM_RETRY_INTERVAL_MS:10000}
  outbox:
    relay-enabled: ${OUTBOX_RELAY_ENABLED:false}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    lease-seconds: ${OUTBOX_LEASE_SECONDS:30}
    transport: ${OUTBOX_TRANSPORT:none}
    exchange: ${RABBIT_EXCHANGE:bc.domain.v1}
  demo:
    seed-enabled: ${DEMO_SEED_ENABLED:true}
  media:
    demo-root: ${DEMO_MEDIA_ROOT:media/demo}
    signing-key: ${MEDIA_SIGNING_KEY:dev-demo-media-signing-key}
    demo-import-enabled: ${DEMO_MEDIA_IMPORT_ENABLED:true}
    preview-ttl-seconds: 120
    vod:
      enabled: ${VOD_ENABLED:false}
      app-id: ${VOD_APP_ID:}
      secret-id: ${VOD_SECRET_ID:}
      secret-key: ${VOD_SECRET_KEY:}
      region: ${VOD_REGION:ap-guangzhou}
      url-key: ${VOD_URL_KEY:}
      pcfg: ${VOD_PCFG:}
      procedure: ${VOD_PROCEDURE:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    rabbit:
      enabled: ${RABBIT_HEALTH_ENABLED:false}

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
  level:
    com.jobbootcamp: INFO