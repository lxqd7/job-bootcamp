server:
  port: ${MARKETING_PORT:18087}
  shutdown: graceful

spring:
  application:
    name: bootcamp-marketing
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${MARKETING_DB_NAME:bc_marketing}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: ${RABBIT_VHOST:/job-bootcamp-dev}
    publisher-confirm-type: correlated
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2s

app:
  internal:
    secret: ${INTERNAL_TOKEN_KEY:dev-only-internal-secret}
  user:
    session-check-url: ${USER_INTERNAL_URL:http://127.0.0.1:18081/int/v1/sessions/check}
    profile-batch-url: ${USER_PROFILE_BATCH_URL:http://127.0.0.1:18081/int/v1/profiles/batch}
  learning:
    completion-events-url: ${LEARNING_COMPLETION_EVENTS_URL:http://127.0.0.1:18083/int/v1/completion-events}
  trade:
    order-status-url: ${TRADE_ORDER_STATUS_URL:http://127.0.0.1:18084/int/v1/orders/status-batch}
  coupon:
    recovery-poll-ms: ${COUPON_RECOVERY_POLL_MS:30000}
  points:
    daily-video-cap: 50
    test-api-enabled: ${POINTS_TEST_API_ENABLED:false}
  redis:
    enabled: ${REDIS_ENABLED:true}
    key-prefix: ${REDIS_KEY_PREFIX:bc:dev:}
  outbox:
    relay-enabled: ${OUTBOX_RELAY_ENABLED:false}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    lease-seconds: ${OUTBOX_LEASE_SECONDS:30}
    transport: ${OUTBOX_TRANSPORT:none}
    exchange: ${RABBIT_EXCHANGE:bc.domain.v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    rabbit:
      enabled: ${RABBIT_HEALTH_ENABLED:false}
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
  level:
    com.jobbootcamp: INFO