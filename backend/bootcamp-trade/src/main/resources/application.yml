server:
  port: ${TRADE_PORT:18084}
  shutdown: graceful

spring:
  application:
    name: bootcamp-trade
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${TRADE_DB_NAME:bc_trade}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: ${RABBIT_VHOST:/job-bootcamp-dev}
    publisher-confirm-type: correlated

app:
  internal:
    secret: ${INTERNAL_TOKEN_KEY:dev-only-internal-secret}
  user:
    session-check-url: ${USER_INTERNAL_URL:http://127.0.0.1:18081/int/v1/sessions/check}
  course:
    snapshot-url: ${COURSE_SNAPSHOT_URL:http://127.0.0.1:18082/int/v1/products/snapshots}
    route-snapshot-url: ${COURSE_ROUTE_SNAPSHOT_URL:http://127.0.0.1:18082/int/v1/routes/snapshots}
  learning:
    access-url: ${LEARNING_ACCESS_URL:http://127.0.0.1:18083/int/v1/access/check}
    sources-url: ${LEARNING_SOURCES_URL:http://127.0.0.1:18083/int/v1/entitlements/sources}
    prepare-url: ${LEARNING_PREPARE_URL:http://127.0.0.1:18083/int/v1/purchases/prepare}
    commit-url: ${LEARNING_COMMIT_URL:http://127.0.0.1:18083/int/v1/purchases/commit}
    release-url: ${LEARNING_RELEASE_URL:http://127.0.0.1:18083/int/v1/purchases/release}
  marketing:
    pricing-calculate-url: ${MARKETING_PRICING_URL:http://127.0.0.1:18087/int/v1/pricing/calculate}
    pricing-status-url: ${MARKETING_PRICING_STATUS_URL:http://127.0.0.1:18087/int/v1/pricing/status}
  payment:
    mode: ${PAYMENT_MODE:mock}
    mock-signing-key: ${PAYMENT_MOCK_SIGNING_KEY:dev-mock-payment-key}
    mock-scenario-enabled: ${PAYMENT_MOCK_SCENARIO_ENABLED:false}
    lifecycle-poll-ms: ${PAYMENT_LIFECYCLE_POLL_MS:30000}
  outbox:
    transport: ${OUTBOX_TRANSPORT:none}
    exchange: ${RABBIT_EXCHANGE:bc.domain.v1}
    relay-enabled: ${OUTBOX_RELAY_ENABLED:false}
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:2000}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    lease-seconds: ${OUTBOX_LEASE_SECONDS:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    rabbit:
      enabled: ${RABBIT_HEALTH_ENABLED:false}

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
  level:
    com.jobbootcamp: INFO