server:
  port: ${ASSIGNMENT_PORT:18085}
  shutdown: graceful

spring:
  application:
    name: bootcamp-assignment
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${ASSIGNMENT_DB_NAME:bc_assignment}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBIT_HOST:127.0.0.1}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: ${RABBIT_VHOST:/job-bootcamp-dev}
    publisher-confirm-type: correlated
    connection-timeout: ${RABBIT_CONNECT_TIMEOUT_MS:2000}

app:
  internal:
    secret: ${INTERNAL_TOKEN_KEY:dev-only-internal-secret}
  user:
    session-check-url: ${USER_INTERNAL_URL:http://127.0.0.1:18081/int/v1/sessions/check}
    profile-batch-url: ${USER_PROFILE_BATCH_URL:http://127.0.0.1:18081/int/v1/profiles/batch}
  course:
    scope-url: ${COURSE_TEACHER_SCOPE_URL:http://127.0.0.1:18082/int/v1/teachers/scope}
    benefit-scope-url: ${COURSE_BENEFIT_SCOPE_URL:http://127.0.0.1:18082/int/v1/teachers/benefit-scope}
  learning:
    access-url: ${LEARNING_ACCESS_URL:http://127.0.0.1:18083/int/v1/access/check}
  ai:
    mode: ${AI_MODE:mock}
    mock-delay-ms: ${AI_MOCK_DELAY_MS:0}
    worker-poll-ms: ${AI_MOCK_POLL_MS:2000}
    worker-concurrency: ${AI_WORKER_CONCURRENCY:4}
    lease-seconds: ${AI_LEASE_SECONDS:90}
    lease-renew-ms: ${AI_LEASE_RENEW_MS:20000}
    max-calls: ${AI_MAX_CALLS:6}
    wakeup-enabled: ${AI_WAKEUP_ENABLED:false}
    wakeup:
      exchange: ${AI_WAKEUP_EXCHANGE:bc.domain.v1}
      queue: ${AI_WAKEUP_QUEUE:bc.assignment.review-requested.v1}
      routing-key: ${AI_WAKEUP_ROUTING_KEY:assignment.review-requested.v1}
    http:
      connect-timeout-ms: ${AI_HTTP_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${AI_HTTP_READ_TIMEOUT_MS:45000}
      retry-delays-ms: ${AI_RETRY_DELAYS_MS:5000,20000}
      qwen:
        base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        model: ${QWEN_MODEL:qwen-plus}
        api-key: ${QWEN_API_KEY:}
      deepseek:
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
        model: ${DEEPSEEK_MODEL:deepseek-chat}
        api-key: ${DEEPSEEK_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    rabbit:
      enabled: ${RABBIT_HEALTH_ENABLED:false}

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
  level:
    com.jobbootcamp: INFO