server:
  port: ${INTERACTION_PORT:18086}
  shutdown: graceful

spring:
  application:
    name: bootcamp-interaction
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${INTERACTION_DB_NAME:bc_interaction}?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  internal:
    secret: ${INTERNAL_TOKEN_KEY:dev-only-internal-secret}
  user:
    session-check-url: ${USER_INTERNAL_URL:http://127.0.0.1:18081/int/v1/sessions/check}
    profile-batch-url: ${USER_PROFILE_BATCH_URL:http://127.0.0.1:18081/int/v1/profiles/batch}
  learning:
    access-url: ${LEARNING_ACCESS_URL:http://127.0.0.1:18083/int/v1/access/check}
  course:
    teacher-scope-url: ${COURSE_TEACHER_SCOPE_URL:http://127.0.0.1:18082/int/v1/teachers/scope}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
  level:
    com.jobbootcamp: INFO