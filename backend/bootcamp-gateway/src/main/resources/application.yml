server:
  port: ${GATEWAY_PORT:18080}
  shutdown: graceful

spring:
  application:
    name: bootcamp-gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: learning-refund
              uri: http://127.0.0.1:18083
              predicates:
                - Path=/api/v1/orders/*/refund-applications,/api/v1/refund-applications/**
            - id: interaction-service
              uri: http://127.0.0.1:18086
              predicates:
                - Path=/api/v1/courses/*/questions,/api/v1/courses/*/notes,/api/v1/me/notes,/api/v1/questions/**,/api/v1/answers/**,/api/v1/comments/**,/api/v1/notes/**,/api/v1/likes/**,/api/v1/teacher/notes/**,/api/v1/admin/content/**,/api/v1/admin/questions/**,/api/v1/admin/notes/**,/api/v1/admin/excellent-rewards,/api/v1/admin/excellent-rewards/**,/api/v1/admin/moderation-actions,/api/v1/admin/moderation-actions/**
            - id: assignment-service
              uri: http://127.0.0.1:18085
              predicates:
                - Path=/api/v1/admin/assignments/**,/api/v1/assignments/**,/api/v1/attempts/**,/api/v1/submissions/**,/api/v1/courses/*/assignments,/api/v1/teacher/courses/*/assignments,/api/v1/teacher/courses/*/submissions,/api/v1/teacher/submissions/**,/api/v1/teacher/benefit-assignments/**,/api/v1/benefit-assignments/**,/api/v1/routes/*/benefit-assignments,/api/v1/dev/assignments/**
            - id: trade-service
              uri: http://127.0.0.1:18084
              predicates:
                - Path=/api/v1/trade/**,/api/v1/orders/**,/api/v1/refunds/**,/api/v1/dev/payments/**,/dev/payments/**,/callbacks/payments/**,/api/v1/dev/refunds/**,/api/v1/admin/orders/**,/api/v1/admin/refunds/**
            - id: learning-service
              uri: http://127.0.0.1:18083
              predicates:
                - Path=/api/v1/me/courses,/api/v1/me/routes,/api/v1/learning/**,/api/v1/lessons/**
            - id: marketing-service
              uri: http://127.0.0.1:18087
              predicates:
                - Path=/api/v1/me/points,/api/v1/me/points/**,/api/v1/me/exchanges,/api/v1/sign-ins,/api/v1/boards/**,/api/v1/me/coupons,/api/v1/activities,/api/v1/activities/**,/api/v1/activity-items/**,/api/v1/exchange-projects,/api/v1/exchange-projects/**,/api/v1/admin/coupon-rules/**,/api/v1/admin/activities/**,/api/v1/admin/activity-items/**,/api/v1/admin/exchange-projects,/api/v1/admin/exchange-projects/**
            - id: user-service
              uri: http://127.0.0.1:18081
              predicates:
                - Path=/api/v1/auth/**,/api/v1/me,/api/v1/me/**,/api/v1/admin/users/**
            - id: course-admin
              uri: http://127.0.0.1:18082
              predicates:
                - Path=/api/v1/admin/courses/**,/api/v1/admin/categories/**,/api/v1/admin/chapters/**,/api/v1/admin/lessons/**,/api/v1/admin/routes/**,/api/v1/admin/teachers/**,/api/v1/admin/media/**
            - id: course-service
              uri: http://127.0.0.1:18082
              predicates:
                - Path=/api/v1/categories,/api/v1/categories/**,/api/v1/courses,/api/v1/courses/**,/api/v1/claims/**,/api/v1/routes,/api/v1/routes/**,/api/v1/teacher/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - http://localhost:15173
                  - http://localhost:15174
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - X-CSRF-Token
                  - X-Client-App
                  - Idempotency-Key
                allowCredentials: true
                maxAge: 3600

app:
  session-check:
    url: ${USER_INTERNAL_URL:http://127.0.0.1:18081/int/v1/sessions/check}
    timeout-ms: 2000
  internal:
    secret: ${INTERNAL_TOKEN_KEY:dev-only-internal-secret}
    issuer: bootcamp-gateway
    audience: bootcamp-user
    operation: sessions:check

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    level: "%5p"
  level:
    com.jobbootcamp: INFO